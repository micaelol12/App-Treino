appId: com.micael.apptreino.development
---
- launchApp:
    clearState: true
- tapOn:
    id: 'auth-sign-up-link'
- tapOn:
    id: 'auth-email-input'
- inputText: 'e2e-progress@app-treino.local'
- tapOn:
    id: 'auth-password-input'
- inputText: 'Treino123'
- tapOn:
    id: 'auth-password-confirmation-input'
- inputText: 'Treino123'
- tapOn:
    id: 'auth-sign-up-button'
- tapOn: 'Ajustes'
- tapOn:
    id: 'workout-plan-add'
- tapOn:
    id: 'workout-division-input'
- inputText: 'Full body'
- tapOn:
    id: 'workout-name-input'
- inputText: 'Agachamento'
- tapOn:
    id: 'workout-save-button'
- tapOn: 'Treino'
- tapOn: 'Iniciar treino'
- tapOn:
    id: 'set-1-load'
- eraseText
- inputText: '80'
- tapOn:
    id: 'set-1-repetitions'
- eraseText
- inputText: '8'
- tapOn:
    id: 'complete-workout'
- assertVisible: 'Treino concluído'
- tapOn: 'OK'
- tapOn: 'Evolução'
- assertVisible: 'Carga máxima'
- assertVisible: '1RM estimada'
- assertVisible: 'Volume'
- tapOn: 'Peso'
- tapOn:
    id: 'weight-value-input'
- eraseText
- inputText: '75.5'
- tapOn:
    id: 'weight-submit'
- assertVisible: 'Pesagem salva.*'
- assertVisible: '75.5 kg'
- tapOn: 'Ajustes'
- tapOn:
    id: 'auth-sign-out-button'
- assertVisible: 'Entrar'
